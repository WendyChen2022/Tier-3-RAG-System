[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tier3-rag-system"
version = "0.1.0"
description = "Tier-3 Agentic RAG System with self-correction, hybrid search, and automated QA"
requires-python = ">=3.11"
dependencies = [
    # LLM orchestration
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-chroma>=0.1",
    "langchain-community>=0.3",
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Document parsing
    "docling>=2.0",
    # Evaluation
    "ragas>=0.2",
    "datasets>=3.0",
    # Configuration
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Storage
    "chromadb>=0.5",
    "redis>=5.0",
    # Logging
    "loguru>=0.7",
    # Utilities
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
]
prod = [
    "gunicorn>=23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-report=xml"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
